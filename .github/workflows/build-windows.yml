name: Build Assinador SIG Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore SigAssinador/SigAssinador.csproj

      - name: Verificar integridade da assinatura e preservacao do original
        run: dotnet run --project tests/SealRegression/SealRegression.csproj -c Release -- ./seal-regression-output

      - name: Compilar executavel Windows
        run: dotnet publish SigAssinador/SigAssinador.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publicacao

      - name: Gerar pacote
        shell: pwsh
        run: |
          Copy-Item README.md ./publicacao/LEIA-ME.txt
          Compress-Archive -Path ./publicacao/* -DestinationPath ./Assinador-SIG-Windows-x64.zip

      - name: Instalar gerador do instalador
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador do Windows
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: Assinador-SIG-Windows-x64
          path: |
            ./Assinador-SIG-Setup.exe
            ./Assinador-SIG-Windows-x64.zip
          if-no-files-found: error

      - name: Publicar versão oficial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.0.0 2>$null) {
            gh release upload v1.0.0 ./Assinador-SIG-Setup.exe ./Assinador-SIG-Windows-x64.zip --clobber
          } else {
            gh release create v1.0.0 ./Assinador-SIG-Setup.exe ./Assinador-SIG-Windows-x64.zip --title "Assinador SIG 1.0.0" --notes "Versão oficial para Windows 10 e 11 de 64 bits. Inclui seleção visual da posição, certificados ICP-Brasil A1/A3, QR Code e validação pública."
          }
